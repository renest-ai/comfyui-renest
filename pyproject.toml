# Metadata for the ComfyUI Registry (registry.comfy.org). This extension has no
# build step and no Python dependencies of its own — it only talks to the Renest
# engine over loopback HTTP.
[project]
name = "comfyui-renest"
description = "Official Renest panel: save a ComfyUI run that worked - models, custom nodes, exact package versions, workflow - and bring it back on another Linux GPU machine, every file checked against its SHA-256."
version = "0.1.14"
license = { file = "LICENSE" }
dependencies = []
# What the Registry shows as supported. Saving workflows and taking back model
# files inside ComfyUI works on Windows, macOS, and Linux; full environment
# rebuilds run on Linux + NVIDIA CUDA.
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/renest-ai/comfyui-renest"
Homepage = "https://renest.ai"
Documentation = "https://renest.ai/docs/plugin-nest-this-run"
"Bug Tracker" = "https://github.com/renest-ai/comfyui-renest/issues"

[tool.comfy]
PublisherId = "renest"
DisplayName = "Renest"
# The Registry takes these as addresses, not files in this repository.
Icon = "https://renest.ai/favicon.svg"
Banner = "https://renest.ai/assets/comfyui-registry-banner.jpg"
