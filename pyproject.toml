# Metadata for the ComfyUI Registry (registry.comfy.org). This extension has no
# build step and no Python dependencies of its own — it only talks to the Renest
# engine over loopback HTTP.
[project]
name = "comfyui-renest"
description = "Nest a working run - rebuild it anywhere, byte for byte. Official Renest panel."
version = "0.1.1"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/renest-ai/comfyui-renest"
Homepage = "https://renest.ai"

[tool.comfy]
PublisherId = "renest"
DisplayName = "Renest"
Icon = ""
